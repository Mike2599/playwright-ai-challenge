name: Playwright + IA

# Se ejecuta a demanda: la suite necesita una API key de IA guardada como secreto del repositorio
# (OPENAI_API_KEY o ANTHROPIC_API_KEY). Settings → Secrets and variables → Actions.
on:
  workflow_dispatch:
    inputs:
      ai_provider:
        description: Proveedor de IA
        type: choice
        options: [openai, anthropic]
        default: openai

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_ENV: ci
      AI_PROVIDER: ${{ inputs.ai_provider }}
      AI_API_KEY: ${{ inputs.ai_provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || secrets.OPENAI_API_KEY }}
      AI_MODEL: ${{ inputs.ai_provider == 'anthropic' && 'claude-haiku-5-5' || 'gpt-4o-mini' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Java solo se usa para generar el reporte de Allure (allure-commandline).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test

      - name: Generar reporte de Allure
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reportes
          path: |
            playwright-report/
            allure-report/
            test-results/
            .ai-logs/ai-usage-summary.json
          retention-days: 14
